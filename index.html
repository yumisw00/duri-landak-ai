<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="DURI LANDAK AI — ruang ngobrol AI milikmu.">
  <title>DURI LANDAK AI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18221d;
      --muted: #7b877f;
      --line: #e7ebe5;
      --paper: #f5f7f2;
      --white: #fff;
      --green: #a9df67;
      --green-dark: #426d22;
      --sidebar: #17201b;
      --sidebar-muted: #9ca9a0;
      --shadow: 0 16px 44px rgba(27, 42, 31, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; height: 100vh; overflow: hidden; color: var(--ink); background: var(--paper); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 266px; flex: 0 0 266px; display: flex; flex-direction: column; padding: 25px 16px 16px; color: #f4f7f2; background: var(--sidebar); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; margin-bottom: 27px; }
    .brand-mark { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 13px; background: var(--green); color: #17201b; box-shadow: 0 4px 18px rgba(169, 223, 103, .18); }
    .brand-name { font-size: 12px; line-height: 1.15; letter-spacing: .105em; font-weight: 850; }
    .brand-caption { margin-top: 4px; color: #a7b3a9; font-size: 10px; letter-spacing: .04em; }
    .new-chat { min-height: 43px; display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; border: 1px solid #39463d; border-radius: 12px; color: #f6f8f4; background: #202c24; font-size: 12px; font-weight: 650; transition: .18s ease; }
    .new-chat:hover { background: #29382d; border-color: #52614f; }
    .side-label { margin: 29px 9px 11px; color: #829087; font-size: 9px; letter-spacing: .14em; font-weight: 750; text-transform: uppercase; }
    .history { flex: 1; overflow: auto; scrollbar-width: thin; scrollbar-color: #435047 transparent; }
    .history-item { display: flex; width: 100%; align-items: center; gap: 9px; margin-bottom: 4px; padding: 10px 10px; border: 0; border-radius: 9px; color: var(--sidebar-muted); background: transparent; font-size: 11px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item:hover, .history-item.active { color: #f5f7f3; background: #26332a; }
    .history-item span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .side-bottom { padding-top: 14px; border-top: 1px solid #303c34; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 10px 8px 5px; }
    .avatar { width: 31px; height: 31px; display: grid; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #25311f; background: #d7ebbc; font-size: 11px; font-weight: 800; }
    .profile-name { font-size: 11px; font-weight: 650; }
    .profile-note { margin-top: 3px; color: #89968d; font-size: 9px; }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; position: relative; }
    .topbar { height: 69px; flex: 0 0 69px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid #e9ede7; background: rgba(255,255,255,.68); }
    .top-left { display: flex; align-items: center; gap: 11px; }
    .mobile-brand { display: none; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .08em; font-weight: 850; }
    .eyebrow { color: #7d897f; font-size: 10px; letter-spacing: .12em; font-weight: 750; text-transform: uppercase; }
    .model-picker { display: inline-flex; align-items: center; gap: 8px; max-width: min(310px, 42vw); border: 1px solid #e5eae3; border-radius: 999px; padding: 7px 10px; color: #354137; background: #fff; }
    .model-select { min-width: 0; max-width: 260px; appearance: none; border: 0; outline: 0; color: #354137; background: transparent; font-size: 10px; font-weight: 650; cursor: pointer; text-overflow: ellipsis; }
    .model-select:disabled { cursor: wait; color: #879187; }
    .model-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #e2ad4e; box-shadow: 0 0 0 3px #fbf3e4; }
    .model-dot.ready { background: #7bae4f; box-shadow: 0 0 0 3px #edf5e5; }
    .demo-label { display: flex; align-items: center; gap: 7px; color: #748077; font-size: 10px; }
    .demo-label svg { color: #8cac67; }
    .demo-label.error svg { color: #bf7758; }
    .conversation { width: min(900px, 100%); flex: 1; display: flex; flex-direction: column; min-height: 0; margin: 0 auto; padding: 26px 42px 0; }
    .messages { flex: 1; overflow: auto; padding: 8px 0 22px; scrollbar-width: thin; scrollbar-color: #d4dbd1 transparent; }
    .welcome { max-width: 620px; margin: clamp(24px, 10vh, 105px) auto 0; text-align: center; animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    .welcome-art { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 22px; border: 1px solid #e7eddf; border-radius: 27px; color: #324329; background: linear-gradient(145deg, #e7f4d8, #f8f9f4); box-shadow: 0 9px 25px rgba(73, 102, 48, .08); transform: rotate(-4deg); }
    .welcome-art svg { transform: rotate(4deg); }
    .welcome h1 { margin: 0; color: #1b281e; font-size: clamp(28px, 4vw, 39px); letter-spacing: -.045em; line-height: 1.12; font-weight: 740; }
    .welcome h1 span { color: #6a983e; }
    .welcome p { max-width: 420px; margin: 14px auto 0; color: #78847a; font-size: 13px; line-height: 1.75; }
    .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin: 29px auto 0; max-width: 560px; text-align: left; }
    .suggestion { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 13px; border: 1px solid #e5eae3; border-radius: 13px; color: #59665b; background: rgba(255,255,255,.75); font-size: 10px; line-height: 1.45; transition: .18s ease; }
    .suggestion:hover { border-color: #c4d8ad; color: #34452d; background: #fff; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(48, 69, 39, .06); }
    .suggestion-icon { flex: 0 0 auto; color: #7fa452; }
    .message-row { display: flex; align-items: flex-start; gap: 11px; max-width: 740px; margin: 18px auto; animation: rise .25s ease both; }
    .message-row.user { flex-direction: row-reverse; }
    .message-avatar { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; color: #34462a; background: #e8f1df; }
    .message-row.user .message-avatar { color: #fff; background: #556c48; }
    .message-body { min-width: 0; max-width: calc(100% - 42px); padding: 11px 14px; border: 1px solid #e8ece6; border-radius: 4px 14px 14px 14px; color: #364139; background: #fff; box-shadow: 0 4px 15px rgba(26, 39, 28, .025); font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-row.user .message-body { border: 0; border-radius: 14px 4px 14px 14px; color: #fff; background: #40543b; }
    .message-body p { margin: 0; }
    .typing { display: flex; gap: 4px; align-items: center; height: 22px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: #9baa92; animation: pulse 1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; }.typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%,80%,100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    .composer-wrap { padding: 12px 0 18px; background: linear-gradient(transparent, var(--paper) 15%); }
    .composer { position: relative; padding: 12px 13px 10px 16px; border: 1px solid #e2e8df; border-radius: 18px; background: #fff; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s; }
    .composer:focus-within { border-color: #b8d398; box-shadow: 0 16px 44px rgba(27, 42, 31, .09), 0 0 0 3px rgba(169, 223, 103, .12); }
    .composer textarea { display: block; width: 100%; min-height: 43px; max-height: 150px; resize: none; border: 0; outline: 0; color: #28352b; background: transparent; font-size: 12px; line-height: 1.6; }
    .composer textarea::placeholder { color: #a0aaa1; }
    .composer-tools { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    .composer-hint { display: flex; align-items: center; gap: 6px; color: #9aa49a; font-size: 9px; }
    .send-button { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 11px; color: #20301d; background: var(--green); transition: .18s ease; }
    .send-button:hover { background: #b8ea7b; transform: translateY(-1px); }
    .send-button:disabled { cursor: default; opacity: .55; transform: none; }
    .footnote { margin-top: 10px; color: #a2aaa2; font-size: 9px; text-align: center; }
    .toast { position: absolute; z-index: 5; left: 50%; bottom: 115px; transform: translate(-50%, 10px); padding: 9px 13px; border: 1px solid #e4e9e1; border-radius: 10px; color: #58645a; background: #fff; box-shadow: 0 8px 25px rgba(27,42,31,.1); font-size: 10px; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .mobile-menu { display: none; border: 0; color: #52604f; background: transparent; }
    @media (max-width: 700px) {
      .sidebar { position: fixed; z-index: 10; inset: 0 auto 0 0; width: min(285px, 84vw); transform: translateX(-102%); transition: transform .22s ease; box-shadow: 18px 0 48px rgba(10,20,12,.18); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: grid; place-items: center; padding: 5px; }
      .topbar { height: 60px; flex-basis: 60px; padding: 0 15px; }
      .top-left { gap: 7px; }
      .eyebrow { display: none; }
      .mobile-brand { display: flex; }
      .mobile-brand .brand-mark { width: 29px; height: 29px; border-radius: 10px; }
      .demo-label { font-size: 0; gap: 0; }
      .demo-label svg { width: 17px; height: 17px; }
      .conversation { padding: 16px 15px 0; }
      .welcome { margin-top: clamp(34px, 10vh, 82px); }
      .welcome-art { width: 64px; height: 64px; border-radius: 23px; margin-bottom: 17px; }
      .welcome p { font-size: 12px; }
      .suggestions { grid-template-columns: 1fr; gap: 7px; margin-top: 22px; }
      .suggestion { min-height: 43px; }
      .composer-wrap { padding-bottom: 12px; }
      .composer { border-radius: 15px; }
    }
    @media (max-width: 380px) {
      .model-picker { max-width: 42vw; padding: 7px 8px; }
      .model-select { max-width: 32vw; font-size: 9px; }
      .topbar { padding: 0 10px; }
      .conversation { padding-right: 11px; padding-left: 11px; }
      .composer-hint { font-size: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="25" height="25" viewBox="0 0 32 32" fill="none"><path d="M16 3.2 18.2 7l4.1-2.1-.2 4.5 4.6.8-2.6 3.7 3.2 3.3-4.4 1.5.5 4.5-4.4-1.3-2.2 3.9-2.2-3.9-4.4 1.3.5-4.5-4.4-1.5 3.2-3.3-2.6-3.7 4.6-.8-.2-4.5L13.8 7 16 3.2Z" fill="currentColor"/><path d="M11.6 16.6a4.5 4.5 0 1 0 9 0 4.5 4.5 0 0 0-9 0Z" fill="#A9DF67"/><path d="M19.8 19.5 23 21l-3.2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div><div class="brand-name">DURI LANDAK AI</div><div class="brand-caption">Teman berpikir digitalmu</div></div>
      </div>
      <button class="new-chat" id="newChat" type="button"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Obrolan baru</button>
      <div class="side-label">Riwayat obrolan</div>
      <nav class="history" id="history" aria-label="Riwayat obrolan"></nav>
      <div class="side-bottom">
        <div class="profile"><div class="avatar">DL</div><div><div class="profile-name">Ruang pribadimu</div><div class="profile-note">Mode pratinjau</div></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Buka menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <div class="mobile-brand"><div class="brand-mark"><svg width="19" height="19" viewBox="0 0 32 32" fill="none"><path d="M16 3.2 18.2 7l4.1-2.1-.2 4.5 4.6.8-2.6 3.7 3.2 3.3-4.4 1.5.5 4.5-4.4-1.3-2.2 3.9-2.2-3.9-4.4 1.3.5-4.5-4.4-1.5 3.2-3.3-2.6-3.7 4.6-.8-.2-4.5L13.8 7 16 3.2Z" fill="currentColor"/><circle cx="16" cy="16.5" r="4.2" fill="#A9DF67"/></svg></div>DURI LANDAK AI</div>
          <span class="eyebrow">Ruang ngobrol</span>
          <label class="model-picker" title="Pilih model gratis OpenRouter"><span class="model-dot" id="modelDot"></span><select class="model-select" id="modelSelect" aria-label="Pilih model AI gratis" disabled><option value="">Memuat katalog gratis…</option></select><svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m3 4.5 3 3 3-3" stroke="#7C887D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></label>
        </div>
        <div class="demo-label" id="connectionStatus"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M5 8.2 7 10l4-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="connectionText">Memuat model gratis</span></div>
      </header>
      <section class="conversation" aria-label="Percakapan">
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea id="prompt" rows="1" placeholder="Tanyakan apa saja ke Duri…" aria-label="Tulis pesan"></textarea>
            <div class="composer-tools"><div class="composer-hint"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2.3v11.4M2.3 8h11.4M4 4l8 8m0-8-8 8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>AI pribadi yang siap membantumu</div><button class="send-button" id="sendButton" type="submit" aria-label="Kirim pesan"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 12.8V3.2M4.1 7.1 8 3.2l3.9 3.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
          </form>
          <div class="footnote">DURI LANDAK AI bisa saja keliru. Periksa kembali informasi penting.</div>
        </div>
      </section>
      <div class="toast" id="toast" role="status"></div>
    </main>
  </div>
  <script>
    (() => {
      const STORAGE_KEY = 'duri-landak-ai-chats-v1';
      const messagesEl = document.getElementById('messages');
      const historyEl = document.getElementById('history');
      const promptEl = document.getElementById('prompt');
      const toastEl = document.getElementById('toast');
      const modelSelect = document.getElementById('modelSelect');
      const modelDot = document.getElementById('modelDot');
      const connectionText = document.getElementById('connectionText');
      const connectionStatus = document.getElementById('connectionStatus');
      const MODEL_STORAGE_KEY = 'duri-landak-ai-free-model-v1';
      let chats = readChats();
      let activeId = chats[0]?.id || null;
      let toastTimer;

      function readChats() {
        try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); return Array.isArray(saved) ? saved : []; }
        catch { return []; }
      }
      function saveChats() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); }
        catch { showToast('Riwayat tidak dapat disimpan di browser ini.'); }
      }
      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
      }
      function icon(name) {
        if (name === 'user') return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.3" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 13.2c.5-2.1 2-3.2 4.5-3.2s4 1.1 4.5 3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
        return '<svg width="16" height="16" viewBox="0 0 32 32" fill="none"><path d="M16 3.2 18.2 7l4.1-2.1-.2 4.5 4.6.8-2.6 3.7 3.2 3.3-4.4 1.5.5 4.5-4.4-1.3-2.2 3.9-2.2-3.9-4.4 1.3.5-4.5-4.4-1.5 3.2-3.3-2.6-3.7 4.6-.8-.2-4.5L13.8 7 16 3.2Z" fill="currentColor"/><circle cx="16" cy="16.5" r="4.2" fill="#A9DF67"/></svg>';
      }
      function renderWelcome() {
        messagesEl.innerHTML = `<div class="welcome">
          <div class="welcome-art" aria-hidden="true"><svg width="43" height="43" viewBox="0 0 32 32" fill="none"><path d="M16 2.7 18.5 7l4.6-2.3-.2 5.1 5.2.9-3 4.2 3.6 3.8-5 1.7.6 5.1-5-1.5-2.5 4.4-2.5-4.4-5 1.5.6-5.1-5-1.7 3.6-3.8-3-4.2 5.2-.9-.2-5.1L13.5 7 16 2.7Z" fill="#40543B"/><path d="M11 16.4a5 5 0 1 0 10 0 5 5 0 0 0-10 0Z" fill="#A9DF67"/><path d="M19.5 19.5 23 21l-3.5.7" stroke="#40543B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h1>Halo, apa yang ingin<br><span>kamu pikirkan?</span></h1>
          <p>Tempat nyaman untuk bertanya, merancang ide, dan menyelesaikan hal-hal kecil maupun besar.</p>
          <div class="suggestions">
            <button class="suggestion" type="button" data-prompt="Bantu saya menyusun rencana belajar yang konsisten"><span class="suggestion-icon">✳</span><span>Bantu susun rencana belajar</span></button>
            <button class="suggestion" type="button" data-prompt="Jelaskan cara kerja kecerdasan buatan dengan sederhana"><span class="suggestion-icon">⌘</span><span>Jelaskan topik yang rumit</span></button>
            <button class="suggestion" type="button" data-prompt="Beri saya ide konten kreatif untuk minggu ini"><span class="suggestion-icon">✎</span><span>Temukan ide kreatif</span></button>
            <button class="suggestion" type="button" data-prompt="Bantu saya menulis pesan yang sopan dan jelas"><span class="suggestion-icon">↗</span><span>Tulis sesuatu bersama</span></button>
          </div>
        </div>`;
        messagesEl.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => {
          promptEl.value = button.dataset.prompt;
          resizeInput();
          promptEl.focus();
        }));
      }
      function renderMessages() {
        const chat = chats.find(item => item.id === activeId);
        if (!chat || chat.messages.length === 0) { renderWelcome(); return; }
        messagesEl.innerHTML = chat.messages.map(message => `<div class="message-row ${message.role === 'user' ? 'user' : ''}"><div class="message-avatar">${icon(message.role)}</div><div class="message-body"><p>${escapeHTML(message.text)}</p></div></div>`).join('');
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      function renderHistory() {
        historyEl.innerHTML = chats.map(chat => `<button class="history-item ${chat.id === activeId ? 'active' : ''}" type="button" data-chat="${escapeHTML(chat.id)}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 3.5h10v7H7l-3.5 2v-9Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><span>${escapeHTML(chat.title || 'Obrolan baru')}</span></button>`).join('');
        historyEl.querySelectorAll('[data-chat]').forEach(button => button.addEventListener('click', () => {
          activeId = button.dataset.chat;
          renderHistory(); renderMessages();
          document.getElementById('sidebar').classList.remove('open');
        }));
      }
      function renderModelOptions(models) {
        let previousModel = null;
        try { previousModel = localStorage.getItem(MODEL_STORAGE_KEY); } catch {}
        modelSelect.innerHTML = models.map(model =>
          `<option value="${escapeHTML(model.id)}">${escapeHTML(model.name)} · Gratis</option>`
        ).join('');
        modelSelect.disabled = false;
        modelSelect.value = models.some(model => model.id === previousModel)
          ? previousModel
          : (models.some(model => model.id === 'openrouter/free')
            ? 'openrouter/free'
            : models[0].id);
        try { localStorage.setItem(MODEL_STORAGE_KEY, modelSelect.value); } catch {}
        modelDot.classList.add('ready');
        connectionStatus.classList.remove('error');
        connectionText.textContent = `${models.length} model gratis OpenRouter`;
      }
      async function loadModels() {
        modelSelect.disabled = true;
        connectionText.textContent = 'Memuat model gratis';
        connectionStatus.classList.remove('error');
        try {
          const response = await fetch('/api/models', { headers: { Accept: 'application/json' } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
          if (!Array.isArray(data.models) || data.models.length === 0) {
            throw new Error('Katalog tidak berisi model chat gratis.');
          }
          renderModelOptions(data.models);
        } catch (error) {
          modelSelect.innerHTML = '<option value="">Model gratis belum tersedia</option>';
          modelSelect.disabled = true;
          connectionText.textContent = 'Koneksi OpenRouter belum siap';
          modelDot.classList.remove('ready');
          connectionStatus.classList.add('error');
          showToast(error.message || 'Gagal memuat katalog model gratis.');
        }
      }
      function newChat() {
        activeId = null;
        renderHistory();
        renderWelcome();
        promptEl.value = '';
        promptEl.focus();
        document.getElementById('sidebar').classList.remove('open');
      }
      function addMessage(role, text) {
        let chat = chats.find(item => item.id === activeId);
        if (!chat) {
          chat = { id: String(Date.now()) + Math.random().toString(36).slice(2, 7), title: text.slice(0, 35) || 'Obrolan baru', messages: [], updatedAt: Date.now() };
          chats.unshift(chat);
          activeId = chat.id;
        }
        chat.messages.push({ role, text });
        chat.updatedAt = Date.now();
        chats.sort((a, b) => b.updatedAt - a.updatedAt);
        saveChats(); renderHistory(); renderMessages();
      }
      function addMessageToChat(chatId, role, text) {
        const chat = chats.find(item => item.id === chatId);
        if (!chat) return;
        chat.messages.push({ role, text });
        chat.updatedAt = Date.now();
        chats.sort((a, b) => b.updatedAt - a.updatedAt);
        saveChats();
        renderHistory();
        if (activeId === chatId) renderMessages();
      }
      async function sendMessage(text) {
        const value = text.trim();
        if (!value) return;
        if (!modelSelect.value) {
          showToast('Tunggu sampai daftar model gratis berhasil dimuat.');
          return;
        }
        addMessage('user', value);
        const chatId = activeId;
        const chat = chats.find(item => item.id === chatId);
        const messages = chat.messages.slice(-20).map(message => ({
          role: message.role,
          content: message.text,
        }));
        promptEl.value = '';
        resizeInput();
        const typingRow = document.createElement('div');
        typingRow.className = 'message-row';
        typingRow.id = 'typingRow';
        typingRow.innerHTML = `<div class="message-avatar">${icon('assistant')}</div><div class="message-body"><div class="typing" aria-label="Mengetik"><i></i><i></i><i></i></div></div>`;
        messagesEl.appendChild(typingRow);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        document.getElementById('sendButton').disabled = true;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ model: modelSelect.value, messages }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || `Permintaan gagal (HTTP ${response.status}).`);
          if (typeof data.reply !== 'string' || !data.reply.trim()) {
            throw new Error('Respons endpoint tidak berisi jawaban.');
          }
          document.getElementById('typingRow')?.remove();
          addMessageToChat(chatId, 'assistant', data.reply);
        } catch (error) {
          document.getElementById('typingRow')?.remove();
          addMessageToChat(chatId, 'assistant', `Koneksi ke AI gagal: ${error.message}`);
        } finally {
          document.getElementById('sendButton').disabled = false;
          promptEl.focus();
        }
      }
      function resizeInput() {
        promptEl.style.height = 'auto';
        promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + 'px';
      }

      document.getElementById('composer').addEventListener('submit', event => { event.preventDefault(); sendMessage(promptEl.value); });
      promptEl.addEventListener('input', resizeInput);
      promptEl.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('composer').requestSubmit(); }
      });
      document.getElementById('newChat').addEventListener('click', newChat);
      document.getElementById('mobileMenu').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
      modelSelect.addEventListener('change', () => {
        try { localStorage.setItem(MODEL_STORAGE_KEY, modelSelect.value); } catch {}
      });
      renderHistory(); renderMessages();
      loadModels();
    })();
  </script>
</body>
</html>
